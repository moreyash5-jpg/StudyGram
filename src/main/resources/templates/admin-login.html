<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | StudyGram</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="admin-page">
        <main class="admin-card">
            <div class="admin-brand">StudyGram</div>

            <h1>Admin Login</h1>
            <p class="admin-subtitle">Sign in to manage StudyGram.</p>

            <p class="admin-error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/admin/login}" method="post">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="admin-submit" type="submit">Sign In</button>
            </form>

            <a class="admin-back" th:href="@{/}">
                ← Back to student login
            </a>
        </main>
    </div>
</body>

</html>
